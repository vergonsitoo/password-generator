<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas Seguras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .password-display {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        #passwordOutput {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            flex: 1;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            min-height: 30px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .controls {
            margin-bottom: 25px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .length-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .length-value {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .generate-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .strength-meter {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 4px;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .weak {
            color: #ff6b6b;
        }

        .medium {
            color: #ffa500;
        }

        .strong {
            color: #51cf66;
        }

        .feedback {
            text-align: center;
            margin-top: 15px;
            height: 20px;
            color: #51cf66;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Generador de Contraseñas</h1>

        <div class="password-display">
            <span id="passwordOutput">Presiona generar</span>
            <button class="copy-btn" id="copyBtn">Copiar</button>
        </div>

        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText">Fortaleza: -</div>

        <div class="controls">
            <div class="control-group">
                <label for="passwordLength">Longitud de la contraseña:</label>
                <input type="range" id="passwordLength" min="4" max="32" value="16">
                <div class="length-display">
                    <span>Caracteres</span>
                    <span class="length-value" id="lengthValue">16</span>
                </div>
            </div>

            <div class="control-group">
                <label>Incluir:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="useUppercase" checked>
                        <label for="useUppercase">Letras mayúsculas (A-Z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useLowercase" checked>
                        <label for="useLowercase">Letras minúsculas (a-z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useNumbers" checked>
                        <label for="useNumbers">Números (0-9)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="useSymbols" checked>
                        <label for="useSymbols">Símbolos (!@#$%^&*)</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="generate-btn" id="generateBtn">Generar Contraseña</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
